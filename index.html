<style>
/* Layout concept: a calm register. Surfaces are tinted by the chosen theme colour; colour is otherwise reserved for the four ratings. */
:root{
  --accent:#16211f; --on-accent:#ffffff; --focus:var(--accent);
  --ink:#16211f; --muted:#576463; --surface:#ffffff;
  --bg:color-mix(in srgb,var(--accent) 5%,#f6f8f7);
  --line:color-mix(in srgb,var(--accent) 16%,#dfe4e3);
  --line-soft:color-mix(in srgb,var(--accent) 9%,#eef1f0);
  --shadow:0 1px 2px rgba(16,28,28,.07),0 4px 14px rgba(16,28,28,.04);
  --r:#c23030; --y:#f2c230; --g:#23844b; --b:#2a63d1;
  --on-r:#ffffff; --on-y:#2a2000; --on-g:#ffffff; --on-b:#ffffff;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
:root[data-accent="navy"]{--accent:#1f3d78}
:root[data-accent="plum"]{--accent:#6b2f80}
:root[data-accent="teal"]{--accent:#0b6466}
:root[data-accent="rust"]{--accent:#a4441a}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#e4ece9; --on-accent:#0e1413; --ink:#e7eeec; --muted:#9aaaa7; --surface:#172020;
    --bg:color-mix(in srgb,var(--accent) 7%,#0d1212);
    --line:color-mix(in srgb,var(--accent) 16%,#273432);
    --line-soft:color-mix(in srgb,var(--accent) 9%,#1d2827);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --r:#ee6b6b; --y:#f0c445; --g:#4cc27f; --b:#6e9df4;
    --on-r:#1a0a0a; --on-y:#241b00; --on-g:#06170d; --on-b:#07142c;
    color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-accent="navy"]{--accent:#9db8ee}
  :root:not([data-theme="light"])[data-accent="plum"]{--accent:#d6a9e8}
  :root:not([data-theme="light"])[data-accent="teal"]{--accent:#6fd0d2}
  :root:not([data-theme="light"])[data-accent="rust"]{--accent:#f0a67c}
}
:root[data-theme="dark"]{
  --accent:#e4ece9; --on-accent:#0e1413; --ink:#e7eeec; --muted:#9aaaa7; --surface:#172020;
  --bg:color-mix(in srgb,var(--accent) 7%,#0d1212);
  --line:color-mix(in srgb,var(--accent) 16%,#273432);
  --line-soft:color-mix(in srgb,var(--accent) 9%,#1d2827);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --r:#ee6b6b; --y:#f0c445; --g:#4cc27f; --b:#6e9df4;
  --on-r:#1a0a0a; --on-y:#241b00; --on-g:#06170d; --on-b:#07142c;
  color-scheme:dark;
}
:root[data-theme="dark"][data-accent="navy"]{--accent:#9db8ee}
:root[data-theme="dark"][data-accent="plum"]{--accent:#d6a9e8}
:root[data-theme="dark"][data-accent="teal"]{--accent:#6fd0d2}
:root[data-theme="dark"][data-accent="rust"]{--accent:#f0a67c}
@supports not (background: color-mix(in srgb, red 5%, white)){
  :root{--bg:#f1f4f3;--line:#dce2e0;--line-soft:#ebefee}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101616;--line:#2b3836;--line-soft:#212c2b}}
  :root[data-theme="dark"]{--bg:#101616;--line:#2b3836;--line-soft:#212c2b}
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 15px/1.5 var(--font-body); -webkit-text-size-adjust:100%;
  padding-block:12px 90px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:920px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.wordmark{font:700 19px/1 var(--font-display);letter-spacing:-.01em}
.logo{display:inline-block;width:28px;height:28px;flex:none}
.logo svg{width:100%;height:100%;display:block}
.logo.big{width:56px;height:56px}
.page-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:20px}
.page-title{font-size:clamp(26px,6vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.themes{margin-top:22px;display:grid;gap:10px;width:100%}
.themes .label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 9px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px}
.swatch i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1px var(--line);flex:none}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
h1{font-size:clamp(30px,7vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.tagline{color:var(--muted);margin-top:6px;max-width:46ch}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:500 12px var(--font-mono);min-height:34px}
.chip.note{border-color:var(--y)}
.chip.warn{border-color:var(--r);color:var(--r)}

.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:12px 14px;min-height:46px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

.wrap[data-view="home"] .bar,.wrap[data-view="home"] .page-head{display:none}
.welcome{padding-top:clamp(20px,9vh,80px);display:grid;gap:16px;justify-items:start}
.stripe{display:flex;width:min(220px,60%);height:12px;border-radius:6px;overflow:hidden}
.stripe i{flex:1}
.welcome h1{font-size:clamp(38px,10.5vw,68px);max-width:12ch}
.lede{font:600 clamp(18px,4.5vw,24px)/1.2 var(--font-display);color:var(--muted)}
.doors{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;margin-top:10px}
@media (min-width:700px){.doors{grid-template-columns:repeat(4,1fr);gap:12px}}
.door{box-shadow:var(--shadow);text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.door:hover{border-color:var(--accent)}
.door{justify-content:flex-start}
.door .go{margin-top:auto}
.door{box-shadow:var(--shadow);min-height:190px;padding:14px}
.door-icon{width:48px;height:48px;border:1.5px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--accent);background:var(--bg)}
.door:hover .door-icon{border-color:var(--accent)}
.door-title{display:block;font:600 19px/1.2 var(--font-display)}
.door-text{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.go{font-size:13px}
.subtabs{display:grid;grid-template-columns:1fr 1fr;max-width:300px;margin-top:18px;border:1.5px solid var(--accent);border-radius:8px;overflow:hidden}
.subtabs button{min-height:44px;border:0;background:var(--surface);font-weight:600}
.subtabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.card h3{font-size:16px;font-weight:600}
.tpl{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.tlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.tcard{box-shadow:var(--shadow);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px}
.tname{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px;margin-top:8px}
.tcols>div{min-width:0}
.tcols h3{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.titem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:44px;cursor:pointer}
.titem input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.ttext{overflow-wrap:anywhere}
.tag{display:inline-block;font:600 11px var(--font-mono);padding:2px 6px;border-radius:4px;background:var(--c);color:var(--on)}
.tag[data-r="R"]{--c:var(--r);--on:var(--on-r)}
.tag[data-r="Y"]{--c:var(--y);--on:var(--on-y)}
.tag[data-r="G"]{--c:var(--g);--on:var(--on-g)}
.tag[data-r="B"]{--c:var(--b);--on:var(--on-b)}
.banner{margin-top:16px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px}

.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.filebtn{position:relative;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--focus);outline-offset:2px}

select,textarea,input[type=text]{
  font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;
  padding:10px 12px;min-height:44px;width:100%;
}
textarea{resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.field.wide{grid-column:1/-1}

.lo-card{box-shadow:var(--shadow);margin-top:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.lo-card h2{font-size:clamp(20px,4.6vw,27px);font-weight:600;line-height:1.2;margin-top:4px}
.criteria{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.criteria li{position:relative;padding-left:18px;color:var(--muted)}
.criteria li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;background:var(--accent);opacity:.7}
.lo-nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

.progress{margin-top:18px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line-soft)}
.seg.R{background:var(--r)} .seg.Y{background:var(--y)} .seg.G{background:var(--g)} .seg.B{background:var(--b)}
.count{margin-top:6px;font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.pupils{list-style:none;margin:12px 0 0;padding:0;border-top:1.5px solid var(--line)}
.pupil{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,350px);gap:8px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft);transition:background-color .6s}
.pupil.flash{background:var(--line-soft)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.pn{font-weight:600;overflow-wrap:anywhere}
.note-toggle{background:none;border:1.5px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);min-height:28px}
.note-toggle.has{border-color:var(--accent);color:var(--accent)}
.note-box{grid-column:1/-1}
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rate{
  min-height:46px;padding:4px 2px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);
  font-size:13px;font-weight:600;box-shadow:inset 0 -5px 0 var(--c);
}
.rate[data-r="R"]{--c:var(--r);--on:var(--on-r)}
.rate[data-r="Y"]{--c:var(--y);--on:var(--on-y)}
.rate[data-r="G"]{--c:var(--g);--on:var(--on-g)}
.rate[data-r="B"]{--c:var(--b);--on:var(--on-b)}
.rate[aria-pressed="true"]{background:var(--c);color:var(--on);border-color:var(--c);box-shadow:none}
.rate[aria-pressed="true"]::before{content:"\2713\00a0"}
.bulk{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){
  .pupil{grid-template-columns:1fr}
  .who{justify-content:space-between}
}

.scroll{box-shadow:var(--shadow);overflow-x:auto;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line-soft);white-space:nowrap}
thead th{font:500 12px var(--font-mono);color:var(--muted);background:var(--surface)}
th.sticky{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;font-weight:600;min-width:150px;border-right:1px solid var(--line-soft)}
tfoot td,tfoot th{font:500 12px var(--font-mono);color:var(--muted);border-bottom:0}
.sum{font:500 12px var(--font-mono);color:var(--muted)}
.cell{position:relative;width:36px;height:36px;border-radius:6px;border:0;background:var(--c);color:var(--on);font:600 13px var(--font-mono);display:inline-grid;place-items:center;padding:0}
.cell[data-r="R"]{--c:var(--r);--on:var(--on-r)}
.cell[data-r="Y"]{--c:var(--y);--on:var(--on-y)}
.cell[data-r="G"]{--c:var(--g);--on:var(--on-g)}
.cell[data-r="B"]{--c:var(--b);--on:var(--on-b)}
.cell.star::after{content:"\2605";position:absolute;top:-5px;right:-4px;font-size:14px;line-height:1;color:var(--ink,#111);text-shadow:0 0 2px var(--surface,#fff),0 0 2px var(--surface,#fff)}
.was{display:block;font:500 12px var(--font-body,inherit);color:var(--muted);margin-top:2px}
.cell.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.keylist{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.keylist b{font:500 12px var(--font-mono);color:var(--ink);margin-right:8px}

.card{box-shadow:var(--shadow);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:18px;margin-top:16px;display:grid;gap:12px}
.card h2{font-size:20px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .field{flex:1 1 120px}
.ta-mono{font-family:var(--font-mono);font-size:13px;line-height:1.5}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.items li>span{min-width:0;overflow-wrap:anywhere}
.items li input{flex:1 1 160px;width:auto;min-width:0}
.row input{flex:1 1 160px;width:auto;min-width:0}
.editor{flex:1 1 100%;display:grid;gap:10px;padding:6px 0 10px}
.items.sub{margin:0}
.items.sub li{padding:6px 0;flex-wrap:nowrap}
.unit-notes{margin-top:10px;color:var(--muted)}
.unit-notes summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:32px;display:flex;align-items:center}
.unit-notes p{margin-top:4px}
.pill{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.empty-state{margin-top:24px;padding:28px 18px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;display:grid;gap:14px;justify-items:center}

.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:8px;font-weight:500;z-index:20}
</style>

<div class="wrap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

var KEY = 'markbook.v1';
var RATE = [
  {k:'R', label:'Below',   meaning:'Below expected'},
  {k:'Y', label:'Towards', meaning:'Working towards expected'},
  {k:'G', label:'Meeting', meaning:'Meeting expected'},
  {k:'B', label:'Above',   meaning:'Above expected'}
];
var MEAN = {}; RATE.forEach(function(r){ MEAN[r.k] = r.meaning; });
var DEF_UI = {tab:'home', sub:'mark', classId:'', unitId:'', loId:'', gridUnit:'all', gridClass:'', editClass:'', editUnit:'', tClass:'', tScope:'all', tStrN:3, tTarN:3, accent:'ink'};

var $ = function(s, r){ return (r || document).querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var slug = function(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); };
function hash(s){ var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function today(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

var SAMPLE_FIRST = ['Amelia','Arjun','Beatriz','Callum','Chloe','Daniel','Ella','Francisco','Grace','Hugo','Imogen','Joao','Kai','Leah','Mateus','Nina','Oliver','Priya','Rafael','Sofia','Tom','Uma','Vitoria','Zack','Alice','Bruno','Clara','Dev','Esme','Filipe','Gabriela','Harry','Isla','Jack','Katya','Luca','Maya','Noah','Olivia','Pedro'];

function blank(){ return {v:1, sample:null, classes:[], units:[], marks:{}, excl:{}, lastExport:null, dirty:0, ui:Object.assign({}, DEF_UI)}; }

function seed(){
  var s = blank(), seedN = 7;
  var rnd = function(){ seedN = (seedN * 1103515245 + 12345) % 2147483648; return seedN / 2147483648; };
  s.sample = {classes:true, units:true, v:2};
  var n = 0;
  s.classes = SAMPLE_FORMS.map(function(f){
    var pupils = [];
    for (var k = 0; k < 8; k++, n++) {
      var name = SAMPLE_FIRST[n % SAMPLE_FIRST.length] + ' ' + SAMPLE_LAST[(n * 7 + 3) % SAMPLE_LAST.length];
      pupils.push({id:slug(f[1]) + ':' + slug(name), name:name});
    }
    return {id:slug(f[1]), name:f[1], year:f[0], pupils:pupils};
  });
  s.units = parseCurriculum(SAMPLE_CURRIC);
  var order = ['R','Y','G','B'];
  var pick = function(){ var x = rnd(); return x < 0.08 ? 'R' : x < 0.3 ? 'Y' : x < 0.75 ? 'G' : 'B'; };
  var notes = ['Needed a prompt to test the program on the device.', 'Explained the condition clearly to a partner.', 'Confident with handles, still tidying outlines.', 'Much more independent than at the start of the unit.'];
  var ni = 0;
  s.classes.forEach(function(c){ c.pupils.forEach(function(p){
    s.units.forEach(function(u, ui){ u.los.forEach(function(lo, li){
      /* Unit 1 fully assessed, unit 2 mostly assessed, last LO of unit 2 only partly */
      if (ui === 1 && li === 2 && rnd() < 0.7) return;
      var cur = pick(), m = {r:cur, n:'', d: ui === 0 ? '2026-09-29' : '2026-10-16', h:[]};
      /* About a third of unit 1 ratings were revisited later, most improving and a few slipping back */
      if (ui === 0 && rnd() < 0.35) {
        var up = rnd() < 0.8, i = order.indexOf(cur), prev = up ? order[Math.max(0, i - 1 - (rnd() < 0.3 ? 1 : 0))] : order[Math.min(3, i + 1)];
        if (prev !== cur) { m.h.push({r:prev, d:'2026-09-15'}); m.d = '2026-10-12'; }
      }
      if (ui === 0 && li === 1 && rnd() < 0.12) m.n = notes[ni++ % notes.length];
      s.marks[p.id + '|' + lo.id] = m;
    }); });
  }); });
  return s;
}

/* ---------- storage ---------- */
var storageOk = true, saveTimer = null;
function validState(o){ return o && Array.isArray(o.classes) && Array.isArray(o.units) && o.marks && typeof o.marks === 'object'; }
function load(){
  try { var t = localStorage.getItem(KEY); if (!t) return null; var o = JSON.parse(t); return validState(o) ? o : null; }
  catch (e) { return null; }
}
function flush(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; }
  paintChip();
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 250); }

var S = load() || seed();
/* Refresh an untouched older sample so it shows the current example data */
if (S.sample && S.sample.classes && S.sample.units && S.sample.v !== 2) { var oldUi = S.ui; S = seed(); S.ui = Object.assign({}, DEF_UI, oldUi || {}); }
S.ui = Object.assign({}, DEF_UI, S.ui || {});
S.ui.tab = 'home';
if (!S.excl) S.excl = {};
if (typeof S.dirty !== 'number') S.dirty = 0;

/* ---------- model helpers ---------- */
var mk = function(p, l){ return p + '|' + l; };
var code = function(u, i){ return 'U' + (S.units.indexOf(u) + 1) + '-L' + (i + 1); };
var flat = function(){ return S.units.reduce(function(a, u){ return a.concat(u.los.map(function(lo, i){ return {u:u, lo:lo, i:i}; })); }, []); };
function getMark(p, l){ return S.marks[mk(p, l)] || null; }

function fixUI(){
  var u = S.ui;
  if (u.tab === 'grid') { u.tab = 'mark'; u.sub = 'grid'; }
  if (!S.classes.some(function(c){ return c.id === u.classId; })) u.classId = S.classes.length ? S.classes[0].id : '';
  if (!S.classes.some(function(c){ return c.id === u.gridClass; })) u.gridClass = u.classId;
  if (!S.classes.some(function(c){ return c.id === u.tClass; })) u.tClass = u.classId;
  if (u.tScope !== 'all' && !S.units.some(function(x){ return x.id === u.tScope; })) u.tScope = 'all';
  u.tStrN = [1, 2, 3].indexOf(Number(u.tStrN)) >= 0 ? Number(u.tStrN) : 3;
  u.tTarN = [1, 2, 3].indexOf(Number(u.tTarN)) >= 0 ? Number(u.tTarN) : 3;
  if (!THEMES.some(function(t){ return t.id === u.accent; })) u.accent = 'ink';
  if (!S.units.some(function(x){ return x.id === u.unitId; })) u.unitId = S.units.length ? S.units[0].id : '';
  var un = S.units.filter(function(x){ return x.id === u.unitId; })[0];
  if (!un || !un.los.some(function(l){ return l.id === u.loId; })) u.loId = un ? un.los[0].id : '';
  if (u.gridUnit !== 'all' && !S.units.some(function(x){ return x.id === u.gridUnit; })) u.gridUnit = 'all';
}
function cur(){
  var u = S.ui;
  var cls = S.classes.filter(function(c){ return c.id === u.classId; })[0];
  var unit = S.units.filter(function(x){ return x.id === u.unitId; })[0];
  var lo = unit ? unit.los.filter(function(l){ return l.id === u.loId; })[0] : null;
  return {cls:cls, unit:unit, lo:lo};
}

function setRate(p, l, r){
  var k = mk(p, l), m = S.marks[k] || {r:'', n:'', d:'', h:[]};
  if (!m.h) m.h = [];
  var prev = m.r, pd = m.d, t = today();
  if (prev === r) { m.r = ''; }
  else {
    /* An earlier-dated rating is kept as history. A change on the same day simply replaces the mark. */
    if (prev && pd && pd < t) m.h.push({r:prev, d:pd});
    m.r = r;
  }
  m.d = (m.r || m.n) ? t : '';
  if (!m.r && !m.n && !m.h.length) delete S.marks[k]; else S.marks[k] = m;
  S.dirty++; save();
}
var LEVEL = {R:1, Y:2, G:3, B:4}, WORD = {R:'Below', Y:'Towards', G:'Meeting', B:'Above'};
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function shortDate(d){ var x = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/); return x ? (+x[3]) + ' ' + MON[+x[2] - 1] : String(d || ''); }
function history(m){ var ev = (m && m.h ? m.h : []).slice(); if (m && m.r) ev.push({r:m.r, d:m.d || ''}); return ev; }
function cellNote(m){
  if (!m) return '';
  var parts = [];
  if (m.n) parts.push(m.n);
  if (m.h && m.h.length) parts.push('History: ' + history(m).map(function(e){ return (WORD[e.r] || e.r) + (e.d ? ' (' + shortDate(e.d) + ')' : ''); }).join(' > '));
  return parts.join('\n\n');
}
function addCellNote(ws, r, c, m){ var t = cellNote(m); if (t) { var a = XLSX.utils.encode_cell({r:r, c:c}); if (ws[a]) ws[a].c = [{a:'Markbook', t:t}]; } }
function changed(m){ return !!(m && m.r && m.h && m.h.length); }
/* Progress: the current rating is higher than the first one recorded */
function improved(m){ if (!changed(m)) return false; var f = history(m)[0]; return LEVEL[m.r] > LEVEL[f.r]; }
function progressOf(m){
  if (!m || !m.r) return {text:'', first:null, n:0};
  var ev = history(m), first = ev[0], diff = LEVEL[m.r] - LEVEL[first.r];
  if (ev.length < 2) return {text:'First mark', first:first, n:1};
  var t = diff > 0 ? 'Up ' + diff + (diff === 1 ? ' level' : ' levels') : diff < 0 ? 'Down ' + (-diff) + (diff === -1 ? ' level' : ' levels') : 'Back to start';
  return {text:t, first:first, n:ev.length};
}
function wasText(m){
  var h = changed(m) ? m.h[m.h.length - 1] : null;
  return h ? 'Was ' + WORD[h.r] + (h.d ? ', ' + shortDate(h.d) : '') : '';
}
function setNote(p, l, text){
  var k = mk(p, l), m = S.marks[k] || {r:'', n:'', d:''};
  m.n = text; if (!m.d) m.d = today();
  if (!m.r && !m.n && !(m.h && m.h.length)) delete S.marks[k]; else S.marks[k] = m;
  save();
}
function removeClass(id){
  var c = S.classes.filter(function(x){ return x.id === id; })[0]; if (!c) return;
  var ids = {}; c.pupils.forEach(function(p){ ids[p.id] = 1; });
  S.classes = S.classes.filter(function(x){ return x !== c; });
  Object.keys(S.marks).forEach(function(k){ if (ids[k.split('|')[0]]) delete S.marks[k]; });
}
function removeUnit(id){
  var u = S.units.filter(function(x){ return x.id === id; })[0]; if (!u) return;
  var ids = {}; u.los.forEach(function(l){ ids[l.id] = 1; });
  S.units = S.units.filter(function(x){ return x !== u; });
  Object.keys(S.marks).forEach(function(k){ if (ids[k.split('|')[1]]) delete S.marks[k]; });
}

/* ---------- parsing ---------- */
function parseDelimited(text){
  text = String(text).replace(/^﻿/, '');
  var first = text.split(/\r?\n/, 1)[0] || '';
  var cnt = function(ch){ return first.split(ch).length - 1; };
  var delim = (cnt('\t') > 0 && cnt('\t') >= Math.max(cnt(';'), cnt(','))) ? '\t' : (cnt(';') > cnt(',') ? ';' : ',');
  var rows = [], row = [], cell = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows;
}

function parsePupils(rows, defForm, defYear){
  var clean = rows.map(function(r){ return r.map(function(c){ return String(c == null ? '' : c).trim(); }); })
                  .filter(function(r){ return r.some(Boolean); });
  if (!clean.length) return {groups:[], count:0};
  var head = clean[0].map(function(c){ return c.toLowerCase(); });
  var find = function(re){ for (var i = 0; i < head.length; i++) if (re.test(head[i])) return i; return -1; };
  var iName = find(/^(pupil|student|name|full name|pupil name)$/);
  var iFirst = find(/^(first name|firstname|forename|given name)$/);
  var iLast = find(/^(surname|last name|lastname|family name)$/);
  var iForm = find(/^(form|class|reg group|registration group|tutor group|form group)$/);
  var iYear = find(/^(year|year group|yr|grade)$/);
  var hasHead = iName >= 0 || iFirst >= 0 || iLast >= 0;
  var body = clean;
  if (hasHead) body = clean.slice(1);
  else { iName = 0; iForm = clean[0].length > 1 ? 1 : -1; iYear = clean[0].length > 2 ? 2 : -1; }
  var map = {}, order = [], count = 0;
  body.forEach(function(r){
    var name = iName >= 0 ? r[iName] : [iFirst >= 0 ? r[iFirst] : '', iLast >= 0 ? r[iLast] : ''].filter(Boolean).join(' ');
    name = String(name || '').replace(/\s+/g, ' ').trim(); if (!name) return;
    var form = (iForm >= 0 && r[iForm]) || defForm || 'Unassigned';
    var ym = iYear >= 0 ? String(r[iYear]).match(/\d+/) : null;
    var yr = ym ? ym[0] : '';
    if (!yr) { var fm = String(form).match(/^\d+/); yr = fm ? fm[0] : (defYear || ''); }
    var gid = slug(form) || 'form';
    if (!map[gid]) { map[gid] = {id:gid, name:form, year:yr, pupils:[]}; order.push(gid); }
    var g = map[gid]; if (!g.year && yr) g.year = yr;
    var id = gid + ':' + slug(name);
    if (!g.pupils.some(function(p){ return p.id === id; })) { g.pupils.push({id:id, name:name}); count++; }
  });
  return {groups:order.map(function(k){ return map[k]; }), count:count};
}

function parseCurriculum(text){
  var units = [], u = null, lo = null;
  var newUnit = function(t){ u = {id:'u-' + (slug(t) || hash(t)), title:t, summary:'', los:[]}; units.push(u); lo = null; };
  String(text).split(/\r?\n/).forEach(function(raw){
    var line = raw.trim(); if (!line) return;
    var m;
    if ((m = line.match(/^(?:unit\s*:|#{1,3}\s)\s*(.+)$/i))) { newUnit(m[1].trim()); return; }
    if ((m = line.match(/^(?:summary|notes?)\s*:\s*(.*)$/i))) { if (!u) newUnit('Untitled unit'); u.summary = (u.summary ? u.summary + ' ' : '') + m[1].trim(); return; }
    if ((m = line.match(/^[-•*–]\s+(.+)$/))) { if (lo) lo.criteria.push(m[1].trim()); return; }
    if (!u) newUnit('Untitled unit');
    var cells = line.split('\t').map(function(c){ return c.trim(); }).filter(Boolean);
    var t = cells.shift().replace(/^(?:lo\s*\d*\s*[:.)-]\s*|\d+\s*[.)]\s+)/i, '').trim();
    if (!t) return;
    var crit = []; cells.forEach(function(c){ c.split(/\s*;\s*/).forEach(function(x){ if (x) crit.push(x); }); });
    var id = 'l-' + hash(u.title + '|' + t);
    if (u.los.some(function(l){ return l.id === id; })) return;
    lo = {id:id, text:t, criteria:crit};
    u.los.push(lo);
  });
  return units.filter(function(x){ return x.los.length; });
}

/* ---------- toast, chip ---------- */
var toastTimer;
function say(msg){ var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 4200); }
function paintChip(){
  var txt, cls = '';
  if (!storageOk) { txt = 'Not stored on this device: export now'; cls = 'warn'; }
  else if (S.dirty > 0) { txt = S.dirty + (S.dirty === 1 ? ' change' : ' changes') + ' since last export'; cls = 'note'; }
  else txt = S.lastExport ? 'Exported ' + S.lastExport : 'Stored on this device';
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){ c.textContent = txt; c.className = 'chip ' + cls; });
}

/* ---------- views ---------- */
function selOpts(items, curId, val, lab){
  return items.map(function(x){ return '<option value="' + esc(val(x)) + '"' + (val(x) === curId ? ' selected' : '') + '>' + esc(lab(x)) + '</option>'; }).join('');
}
function banner(){
  if (S.sample && (S.sample.classes || S.sample.units))
    return '<p class="banner">Sample data: Years 5 and 6 with example pupils, two units and some ratings that improved over time (starred). Importing your own class list or objectives in Set up replaces the matching sample.</p>';
  return '';
}
function empty(msg, btn, tab){
  return '<div class="empty-state"><p>' + esc(msg) + '</p><button class="btn" type="button" data-act="tab" data-tab="' + tab + '">' + esc(btn) + '</button></div>';
}
function legendHTML(){
  return '<div class="legend">' + RATE.map(function(r){ return '<span><i style="background:var(--' + r.k.toLowerCase() + ')"></i>' + esc(r.label) + ': ' + esc(r.meaning.toLowerCase()) + '</span>'; }).join('') + '</div>';
}
function progressHTML(){
  var c = cur(); if (!c.cls || !c.lo) return '';
  var counts = {R:0, Y:0, G:0, B:0}, marked = 0;
  c.cls.pupils.forEach(function(p){ var m = getMark(p.id, c.lo.id); if (m && m.r) { counts[m.r]++; marked++; } });
  var n = c.cls.pupils.length;
  var detail = RATE.filter(function(r){ return counts[r.k]; }).map(function(r){ return counts[r.k] + ' ' + r.label; }).join(' · ');
  return '<div class="bar" role="img" aria-label="' + marked + ' of ' + n + ' marked">' +
    RATE.map(function(r){ return '<span class="seg ' + r.k + '" style="flex:' + counts[r.k] + '"></span>'; }).join('') +
    '</div><p class="count">' + marked + ' of ' + n + ' marked' + (detail ? ': ' + esc(detail) : '') + '</p>';
}
function pupilRow(p, i, lo){
  var m = getMark(p.id, lo.id) || {r:'', n:''};
  var btns = RATE.map(function(r){
    return '<button type="button" class="rate" data-r="' + r.k + '" aria-pressed="' + (m.r === r.k) + '" title="' + esc(r.meaning) + '">' + r.label + '</button>';
  }).join('');
  return '<li class="pupil" data-p="' + esc(p.id) + '">' +
    '<div class="who"><span class="pn">' + esc(p.name) + (wasText(m) ? '<span class="was">' + (improved(m) ? '\u2605 ' : '') + esc(wasText(m)) + '</span>' : '') + '</span>' +
    '<button type="button" class="note-toggle' + (m.n ? ' has' : '') + '" data-act="note" aria-expanded="' + (!!m.n) + '" aria-label="Note for ' + esc(p.name) + '">Note</button></div>' +
    '<div class="rates" role="group" aria-label="Rating for ' + esc(p.name) + '">' + btns + '</div>' +
    '<div class="note-box"' + (m.n ? '' : ' hidden') + '><textarea id="note-' + i + '" rows="2" placeholder="Observation note (optional)" aria-label="Note for ' + esc(p.name) + '">' + esc(m.n) + '</textarea></div>' +
  '</li>';
}

function viewMark(){
  var c = cur();
  if (!c.cls || !c.unit || !c.lo) return banner() + empty('Add a class list and some learning objectives to start marking.', 'Go to Set up', 'setup');
  var pos = flat().map(function(f){ return f.lo.id; }).indexOf(c.lo.id), total = flat().length;
  var i = c.unit.los.indexOf(c.lo);
  return banner() +
  '<section class="pick">' +
    '<label class="field"><span>Form</span><select id="selClass">' + selOpts(S.classes, S.ui.classId, function(x){ return x.id; }, function(x){ return x.name + (x.year ? ' (Year ' + x.year + ')' : ''); }) + '</select></label>' +
    '<label class="field"><span>Unit</span><select id="selUnit">' + selOpts(S.units, S.ui.unitId, function(x){ return x.id; }, function(x){ return x.title; }) + '</select></label>' +
    '<label class="field wide"><span>Learning objective</span><select id="selLO">' + c.unit.los.map(function(l, k){ return '<option value="' + esc(l.id) + '"' + (l.id === c.lo.id ? ' selected' : '') + '>' + esc(code(c.unit, k) + '  ' + l.text) + '</option>'; }).join('') + '</select></label>' +
  '</section>' +
  '<section class="lo-card">' +
    '<p class="eyebrow mono">' + esc(code(c.unit, i)) + ' · ' + esc(c.unit.title) + '</p>' +
    '<h2>' + esc(c.lo.text) + '</h2>' +
    (c.unit.summary ? '<details class="unit-notes"><summary>Unit notes</summary><p>' + esc(c.unit.summary) + '</p></details>' : '') +
    (c.lo.criteria.length ? '<ul class="criteria">' + c.lo.criteria.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
    '<div class="lo-nav"><button class="btn ghost" type="button" data-act="prev"' + (pos <= 0 ? ' disabled' : '') + '>Previous objective</button>' +
    '<button class="btn ghost" type="button" data-act="next"' + (pos >= total - 1 ? ' disabled' : '') + '>Next objective</button>' +
    '<button class="btn ghost" type="button" data-act="editUnitFromMark">Edit unit</button></div>' +
  '</section>' +
  '<section class="progress" id="progress">' + progressHTML() + '</section>' +
  legendHTML() +
  '<ul class="pupils" id="pupils">' + c.cls.pupils.map(function(p, k){ return pupilRow(p, k, c.lo); }).join('') + '</ul>' +
  '<div class="bulk"><button class="btn ghost" type="button" data-act="allMeeting">Mark all unmarked as Meeting</button>' +
  '<button class="btn ghost" type="button" data-act="editClassFromMark">Add or remove pupils</button></div>';
}

function viewGrid(){
  var cls = S.classes.filter(function(c){ return c.id === S.ui.gridClass; })[0];
  if (!cls || !S.units.length) return banner() + empty('Add a class list and some learning objectives to see the grid.', 'Go to Set up', 'setup');
  var units = S.ui.gridUnit === 'all' ? S.units : S.units.filter(function(x){ return x.id === S.ui.gridUnit; });
  var cols = [];
  units.forEach(function(un){ un.los.forEach(function(lo, i){ cols.push({un:un, lo:lo, code:code(un, i)}); }); });
  var unitOpts = '<option value="all"' + (S.ui.gridUnit === 'all' ? ' selected' : '') + '>All units</option>' + selOpts(S.units, S.ui.gridUnit, function(x){ return x.id; }, function(x){ return x.title; });
  var rows = cls.pupils.map(function(p){
    var secure = 0, marked = 0;
    var cells = cols.map(function(cl){
      var m = getMark(p.id, cl.lo.id), r = m && m.r;
      if (r) { marked++; if (r === 'G' || r === 'B') secure++; }
      var star = improved(m);

  }); }); });

function reconcileUnit(old, nu){
  var matched = {}, done = nu.los.map(function(){ return false; });
  nu.los.forEach(function(lo, i){
    for (var k = 0; k < old.los.length; k++) {
      var o = old.los[k];
      if (!matched[o.id] && o.text === lo.text) { lo.id = o.id; matched[o.id] = 1; done[i] = true; break; }
    }
  });
  nu.los.forEach(function(lo, i){
    if (done[i]) return;
    var o = old.los[i];

  });

}

function tableToUnits(rows){
  var clean = rows.map(function(r){ return r.map(function(c){ return String(c == null ? '' : c).trim(); }); });
  var hi = -1;
  for (var i = 0; i < Math.min(clean.length, 6) && hi < 0; i++) {
    var low = clean[i].map(function(c){ return c.toLowerCase(); });
    if (low.some(function(c){ return /^unit( title)?$/.test(c); }) && low.some(function(c){ return /^(learning objectives?|objectives?|lo)$/.test(c); })) hi = i;
  }
  if (hi < 0) return null;
  var head = clean[hi].map(function(c){ return c.toLowerCase(); });
  var f = function(re){ for (var k = 0; k < head.length; k++) if (re.test(head[k])) return k; return -1; };
  var iU = f(/^unit( title)?$/), iS = f(/^(unit summary|summary|unit notes|notes?)$/), iL = f(/^(learning objectives?|objectives?|lo)$/), iC = f(/^(success criteria|success criterion|criteria)$/);
  var units = [], u = null, skipped = 0;
  var getUnit = function(t){
    var found = units.filter(function(x){ return x.title === t; })[0];
    if (!found) { found = {id:'u-' + (slug(t) || hash(t)), title:t, summary:'', los:[]}; units.push(found); }
    return found;
  };
  clean.slice(hi + 1).forEach(function(r){
    if (!r.some(Boolean)) return;
    var t = r[iU] || '', lo = (r[iL] || '').replace(/^(?:lo\s*\d*\s*[:.)-]\s*|\d+\s*[.)]\s+)/i, '').trim();
    if (t) u = getUnit(t);
    var s = iS >= 0 ? r[iS] : '';
    if (!lo) { if (iC >= 0 && r[iC]) skipped++; if (u && s && !u.summary) u.summary = s; return; }
    if (!u) u = getUnit('Untitled unit');
    if (s && !u.summary) u.summary = s;
    var crit = (iC >= 0 ? r[iC] : '').split(/\r?\n|;/).map(function(x){ return x.replace(/^[-•*]\s*/, '').trim(); }).filter(Boolean);
    var id = 'l-' + hash(u.title + '|' + lo);
    if (u.los.some(function(l){ return l.id === id; })) return;
    u.los.push({id:id, text:lo, criteria:crit});
  });
  return {units:units.filter(function(x){ return x.los.length; }), skipped:skipped};
}
function parseCurriculumInput(text){
  var first = String(text).split(/\r?\n/, 1)[0] || '';
  if (/[\t,;]/.test(first) && /unit/i.test(first) && /objective|\blo\b/i.test(first)) {
    var r = tableToUnits(parseDelimited(text)); if (r) return r;
  }
  return {units:parseCurriculum(text), skipped:0};
}

      var wb = XLSX.read(await file.arrayBuffer(), {type:'array'});

  }
  try { await d.save({filename:name, data:data}); return true; }

  note: function(t){
    var li = t.closest('.pupil'), box = li.querySelector('.note-box');
    box.hidden = !box.hidden; t.setAttribute('aria-expanded', String(!box.hidden));
    if (!box.hidden) li.querySelector('textarea').focus();
  },
  prev: function(){ step(-1); },
  next: function(){ step(1); },
  allMeeting: function(){
    var c = cur(); if (!c.cls || !c.lo) return; var n = 0;
    c.cls.pupils.forEach(function(p){ var m = getMark(p.id, c.lo.id); if (!m || !m.r) { setRate(p.id, c.lo.id, 'G'); n++; } });
    render(); say(n ? n + ' pupils marked Meeting.' : 'Everyone is already marked.');
  },
  goto: function(t){
    S.ui.classId = S.ui.gridClass; S.ui.unitId = t.dataset.u; S.ui.loId = t.dataset.l; S.ui.tab = 'mark'; S.ui.sub = 'mark'; save(); render(); window.scrollTo(0, 0);
    var pid = t.dataset.p;
    Array.prototype.forEach.call(app.querySelectorAll('.pupil'), function(li){
      if (li.dataset.p === pid) { li.scrollIntoView({block:'center'}); li.classList.add('flash'); setTimeout(function(){ li.classList.remove('flash'); }, 1400); }
    });
  },
  rmClass: function(t){ arm(t, function(){ removeClass(t.dataset.id); save(); render(); say('Class removed.'); }, 'Tap again to remove'); },
  rmUnit: function(t){ arm(t, function(){ removeUnit(t.dataset.id); save(); render(); say('Unit removed.'); }, 'Tap again to remove'); },
  loadSample: function(t){ arm(t, function(){ var ui = S.ui; S = seed(); S.ui = Object.assign({}, DEF_UI, {tab:ui.tab}); flush(); render(); say('Sample data loaded.'); }, 'Tap again to replace all data'); },
  clearAll: function(t){ arm(t, function(){ var ui = S.ui; S = blank(); S.ui = Object.assign({}, DEF_UI, {tab:ui.tab}); flush(); render(); say('All data removed.'); }, 'Tap again to remove everything'); },
  importNames: function(){
    var ta = $('#pasteNames'), d = readDefaults();
    commitPupils(parsePupils(parseDelimited(ta ? ta.value : ''), d.form, d.year));
  },
  addCurric: addCurriculum,
  tCopy: async function(){
    var cls = S.classes.filter(function(c){ return c.id === S.ui.tClass; })[0]; if (!cls) return;
    var text = stText(cls, S.ui.tScope);
    try { await navigator.clipboard.writeText(text); say('Copied reporting text for ' + cls.name + '.'); }
    catch (e) { var b = $('#tFallback'); if (b) { b.hidden = false; b.value = text; b.focus(); b.select(); } say('Select all and copy the text shown.'); }
  },
  tCsv: async function(){
    var cls = S.classes.filter(function(c){ return c.id === S.ui.tClass; })[0]; if (!cls) return;
    await saveFile('markbook-reporting-' + (slug(cls.name) || 'form') + '-' + today() + '.csv', toCSV(stRows(cls, S.ui.tScope), stCols()));
  },
  tXlsx: async function(){
    var cls = S.classes.filter(function(c){ return c.id === S.ui.tClass; })[0]; if (!cls) return;
    if (typeof XLSX === 'undefined') { say('The Excel library did not load. Use Download CSV instead.'); return; }
    var cols = stCols(), rows = stRows(cls, S.ui.tScope);
    var ws = XLSX.utils.aoa_to_sheet([cols].concat(rows.map(function(r){ return cols.map(function(k){ return r[k]; }); })));
    ws['!cols'] = [{wch:11},{wch:8},{wch:22},{wch:24}].concat(cols.slice(4).map(function(){ return {wch:48}; }));
    var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Reporting');
    await saveFile('markbook-reporting-' + (slug(cls.name) || 'form') + '-' + today() + '.xlsx', XLSX.write(wb, {bookType:'xlsx', type:'array'}));
  },
  driveSoon: function(){ say('Saving straight to Drive is not built yet. For now, download the Excel file, then upload it to your school Drive.'); },
  tplDownload: downloadTemplate,
  tplPrompt: copyPrompt,
  editClass: function(t){ S.ui.editClass = (S.ui.editClass === t.dataset.id) ? '' : t.dataset.id; save(); render(); },
  editUnit: function(t){ S.ui.editUnit = (S.ui.editUnit === t.dataset.id) ? '' : t.dataset.id; save(); render(); },
  saveUnit: saveUnitEdit,
  addPupil: addPupil,
  rmPupil: function(t){
    var c = editingClass(); if (!c) return;
    arm(t, function(){
      c.pupils = c.pupils.filter(function(p){ return p.id !== t.dataset.p; });
      Object.keys(S.marks).forEach(function(k){ if (k.split('|')[0] === t.dataset.p) delete S.marks[k]; });
      S.dirty++; save(); render(); say('Pupil removed.');
    }, 'Tap again to remove');
  },
  editUnitFromMark: function(){
    S.ui.editUnit = S.ui.unitId; S.ui.tab = 'setup'; save(); render();
    var ta = $('#edUnitText'); if (ta) { ta.scrollIntoView({block:'center'}); ta.focus(); }
  },
  editClassFromMark: function(){
    S.ui.editClass = S.ui.classId; S.ui.tab = 'setup'; save(); render();
    var inp = $('#newPupil'); if (inp) { inp.scrollIntoView({block:'center'}); inp.focus(); }
  },
  xlsx: exportXlsx, csv: exportCsv, copyCsv: copyCsv, json: exportJson
};
function step(dir){
  var f = flat(), id = S.ui.loId, i = -1;
  f.forEach(function(x, k){ if (x.lo.id === id) i = k; });
  var t = f[i + dir]; if (!t) return;
  S.ui.unitId = t.u.id; S.ui.loId = t.lo.id; save(); render();
}

app.addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t || !app.contains(t)) return;
  if (t.classList.contains('rate')) {
    var li = t.closest('.pupil'), c = cur();
    setRate(li.dataset.p, c.lo.id, t.dataset.r); paintRow(li); paintProgress(); paintChip(); return;
  }
  var a = t.dataset.act; if (a && actions[a]) actions[a](t, e);
});
app.addEventListener('input', function(e){
  var ta = e.target;
  if (ta.tagName === 'TEXTAREA' && ta.closest('.pupil')) {
    var li = ta.closest('.pupil'), c = cur(); setNote(li.dataset.p, c.lo.id, ta.value);
    var tg = li.querySelector('.note-toggle'); if (tg) tg.classList.toggle('has', !!ta.value);
  }
});
app.addEventListener('change', function(e){
  var el = e.target, id = el.id;
  if (el.tagName === 'TEXTAREA' && el.closest('.pupil')) { S.dirty++; save(); paintChip(); return; }
  if (el.type === 'checkbox' && el.dataset.k) {
    if (el.checked) delete S.excl[el.dataset.k]; else S.excl[el.dataset.k] = 1;
    S.dirty++; save(); paintChip(); return;
  }
  if (el.classList && el.classList.contains('pname-in')) {
    var ec = editingClass(), ep = ec && ec.pupils.filter(function(x){ return x.id === el.dataset.p; })[0], ev = el.value.replace(/\s+/g, ' ').trim();
    if (ep) { if (ev) { ep.name = ev; S.dirty++; save(); paintChip(); } else el.value = ep.name; }
    return;
  }
  if (id === 'edClassName' || id === 'edClassYear') {
    var cc = editingClass(), cv = el.value.trim();
    if (cc) {
      if (id === 'edClassName') { if (cv) cc.name = cv; else el.value = cc.name; } else cc.year = cv;
      S.dirty++; save(); render();
    }
    return;
  }
  if (id === 'selClass') { S.ui.classId = el.value; save(); render(id); }
  else if (id === 'selUnit') { S.ui.unitId = el.value; S.ui.loId = ''; save(); render(id); }
  else if (id === 'selLO') { S.ui.loId = el.value; save(); render(id); }
  else if (id === 'gClass') { S.ui.gridClass = el.value; save(); render(id); }
  else if (id === 'gUnit') { S.ui.gridUnit = el.value; save(); render(id); }
  else if (id === 'tClass') { S.ui.tClass = el.value; save(); render(id); }
  else if (id === 'tScope') { S.ui.tScope = el.value; save(); render(id); }
  else if (id === 'tStrN') { S.ui.tStrN = Number(el.value); save(); render(id); }
  else if (id === 'tTarN') { S.ui.tTarN = Number(el.value); save(); render(id); }
  else if (id === 'fileInput' && el.files[0]) { handleNamesFile(el.files[0]); }
  else if (id === 'restoreInput' && el.files[0]) { restoreFile(el.files[0]); }
  else if (id === 'tplInput' && el.files[0]) { handleTemplateFile(el.files[0]); }
});
app.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.id === 'newPupil') { e.preventDefault(); addPupil(); }
});
$('#homeBtn').addEventListener('click', function(){ go('home'); });
$('#chip').addEventListener('click', function(){ go('export'); });

render();
})();
</script>
