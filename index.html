<style>
/* Layout concept: a calm register. Surfaces are tinted by the chosen theme colour; colour is otherwise reserved for the four ratings. */
:root{
  --accent:#16211f; --on-accent:#ffffff; --focus:var(--accent);
  --ink:#16211f; --muted:#576463; --surface:#ffffff;
  --bg:color-mix(in srgb,var(--accent) 5%,#f6f8f7);
  --line:color-mix(in srgb,var(--accent) 16%,#dfe4e3);
  --line-soft:color-mix(in srgb,var(--accent) 9%,#eef1f0);
  --shadow:0 1px 2px rgba(16,28,28,.07),0 4px 14px rgba(16,28,28,.04);
  --r:#c23030; --y:#f2c230; --g:#23844b; --b:#2a63d1;
  --on-r:#ffffff; --on-y:#2a2000; --on-g:#ffffff; --on-b:#ffffff;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
:root[data-accent="navy"]{--accent:#1f3d78}
:root[data-accent="plum"]{--accent:#6b2f80}
:root[data-accent="teal"]{--accent:#0b6466}
:root[data-accent="rust"]{--accent:#a4441a}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#e4ece9; --on-accent:#0e1413; --ink:#e7eeec; --muted:#9aaaa7; --surface:#172020;
    --bg:color-mix(in srgb,var(--accent) 7%,#0d1212);
    --line:color-mix(in srgb,var(--accent) 16%,#273432);
    --line-soft:color-mix(in srgb,var(--accent) 9%,#1d2827);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --r:#ee6b6b; --y:#f0c445; --g:#4cc27f; --b:#6e9df4;
    --on-r:#1a0a0a; --on-y:#241b00; --on-g:#06170d; --on-b:#07142c;
    color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-accent="navy"]{--accent:#9db8ee}
  :root:not([data-theme="light"])[data-accent="plum"]{--accent:#d6a9e8}
  :root:not([data-theme="light"])[data-accent="teal"]{--accent:#6fd0d2}
  :root:not([data-theme="light"])[data-accent="rust"]{--accent:#f0a67c}
}
:root[data-theme="dark"]{
  --accent:#e4ece9; --on-accent:#0e1413; --ink:#e7eeec; --muted:#9aaaa7; --surface:#172020;
  --bg:color-mix(in srgb,var(--accent) 7%,#0d1212);
  --line:color-mix(in srgb,var(--accent) 16%,#273432);
  --line-soft:color-mix(in srgb,var(--accent) 9%,#1d2827);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --r:#ee6b6b; --y:#f0c445; --g:#4cc27f; --b:#6e9df4;
  --on-r:#1a0a0a; --on-y:#241b00; --on-g:#06170d; --on-b:#07142c;
  color-scheme:dark;
}
:root[data-theme="dark"][data-accent="navy"]{--accent:#9db8ee}
:root[data-theme="dark"][data-accent="plum"]{--accent:#d6a9e8}
:root[data-theme="dark"][data-accent="teal"]{--accent:#6fd0d2}
:root[data-theme="dark"][data-accent="rust"]{--accent:#f0a67c}
@supports not (background: color-mix(in srgb, red 5%, white)){
  :root{--bg:#f1f4f3;--line:#dce2e0;--line-soft:#ebefee}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101616;--line:#2b3836;--line-soft:#212c2b}}
  :root[data-theme="dark"]{--bg:#101616;--line:#2b3836;--line-soft:#212c2b}
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 15px/1.5 var(--font-body); -webkit-text-size-adjust:100%;
  padding-block:12px 90px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:920px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
/* Touch devices: no tap delay or grey flash, 16px fields so iPhones do not zoom in, and room for the home indicator */
html{-webkit-text-size-adjust:100%}
html,body,#app,*{touch-action:manipulation}
button,a,label,select,input,textarea{-webkit-tap-highlight-color:transparent}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (pointer:coarse){input,select,textarea{font-size:16px}}
.wrap{padding-bottom:max(0px, env(safe-area-inset-bottom))}
.credit{margin:36px 0 18px;padding-top:12px;border-top:1px solid var(--line, #d9dfdd);font-size:12px;color:var(--muted);text-align:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.bar-row{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.bar-row .brand{justify-self:start}
.bar-row .hdr-credit{justify-self:end}
.homebtn{min-height:44px;min-width:56px;padding:0 14px;display:inline-grid;place-items:center}
.brand{display:flex;align-items:center;gap:10px}
.hdr-credit{font:500 12px/1 var(--font-body);color:var(--muted);white-space:nowrap}
@media (max-width:420px){.hdr-credit{font-size:11px;white-space:nowrap}.bar-row{gap:6px}}
.wordmark{font:700 19px/1 var(--font-display);letter-spacing:-.01em}
.logo{display:inline-block;width:28px;height:28px;flex:none}
.logo svg{width:100%;height:100%;display:block}
.logo.big{width:56px;height:56px}
.page-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:20px}
.page-title{font-size:clamp(26px,6vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.themes{margin-top:22px;display:grid;gap:10px;width:100%}
.themes .label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 9px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px}
.swatch i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1px var(--line);flex:none}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
h1{font-size:clamp(30px,7vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.tagline{color:var(--muted);margin-top:6px;max-width:46ch}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:500 12px var(--font-mono);min-height:34px}
.chip.note{border-color:var(--y)}
.chip.warn{border-color:var(--r);color:var(--r)}

.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:12px 14px;min-height:46px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

.wrap[data-view="home"] .bar,.wrap[data-view="home"] .page-head{display:none}
.welcome{padding-top:clamp(20px,9vh,80px);display:grid;gap:16px;justify-items:start}
.stripe{display:flex;width:min(220px,60%);height:12px;border-radius:6px;overflow:hidden}
.stripe i{flex:1}
.welcome h1{font-size:clamp(38px,10.5vw,68px);max-width:12ch}
.lede{font:600 clamp(18px,4.5vw,24px)/1.2 var(--font-display);color:var(--muted)}
.doors{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;margin-top:10px}
@media (min-width:700px){.doors{grid-template-columns:repeat(3,1fr);gap:12px}}
@media (min-width:1100px){.doors{grid-template-columns:repeat(5,1fr)}}
.door{box-shadow:var(--shadow);text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.door:hover{border-color:var(--accent)}
.door{justify-content:flex-start}
.door .go{margin-top:auto}
.door{box-shadow:var(--shadow);min-height:190px;padding:14px}
.door-icon{width:48px;height:48px;border:1.5px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--accent);background:var(--bg)}
.door:hover .door-icon{border-color:var(--accent)}
.door-title{display:block;font:600 19px/1.2 var(--font-display)}
.door-text{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.go{font-size:13px}
.subtabs{display:grid;grid-template-columns:1fr 1fr;max-width:300px;margin-top:18px;border:1.5px solid var(--accent);border-radius:8px;overflow:hidden}
.subtabs button{min-height:44px;border:0;background:var(--surface);font-weight:600}
.subtabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.card h3{font-size:16px;font-weight:600}
.tpl{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.tlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.tcard{box-shadow:var(--shadow);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px}
.tname{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px;margin-top:8px}
.tcols>div{min-width:0}
.tcols h3{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.titem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:44px;cursor:pointer}
.titem input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.ttext{overflow-wrap:anywhere}
.tag{display:inline-block;font:600 11px var(--font-mono);padding:2px 6px;border-radius:4px;background:var(--c);color:var(--on)}
.tag[data-r="R"]{--c:var(--r);--on:var(--on-r)}
.tag[data-r="Y"]{--c:var(--y);--on:var(--on-y)}
.tag[data-r="G"]{--c:var(--g);--on:var(--on-g)}
.tag[data-r="B"]{--c:var(--b);--on:var(--on-b)}
.banner{margin-top:16px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px}

.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.filebtn{position:relative;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--focus);outline-offset:2px}

select,textarea,input[type=text],input[type=number]{
  font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;
  padding:10px 12px;min-height:44px;width:100%;
}
textarea{resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.pick select{min-height:48px;font-size:16px}
table.plan{border-collapse:separate;border-spacing:0;font-size:14px}
table.plan td,table.plan th{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--line-soft, var(--line));min-width:200px;text-align:left}
table.plan .pl-lab{position:sticky;left:0;z-index:2;background:var(--bg);min-width:150px;max-width:150px;white-space:normal;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-right:1px solid var(--line)}
.pu0{--pc:#1f3d78}.pu1{--pc:#23663a}.pu2{--pc:#8a5a00}.pu3{--pc:#5b3a7a}
.pl-unit{background:var(--pc);color:#fff;font:600 16px var(--font-display);text-align:center!important}
.pl-sum{background:color-mix(in srgb,var(--pc) 14%,var(--surface));font-style:italic;text-align:center!important}
.pl-ref{background:color-mix(in srgb,var(--pc) 14%,var(--surface));font:600 13px var(--font-mono, monospace);text-align:center!important}
.pl-lo{font-weight:600}
.pl-n{font-variant-numeric:tabular-nums;color:var(--muted)}
.pl-pct{font-size:13px}.pl-pct b{font-size:15px}
.pl-bar{display:block;height:8px;border-radius:4px;background:var(--line-soft, var(--line));margin-bottom:5px;overflow:hidden}
.pl-bar i{display:block;height:100%;background:var(--g)}
.pl-pct.mixed .pl-bar i{background:var(--y)}.pl-pct.revisit .pl-bar i{background:var(--r)}
.pl-rank{font-size:13px;color:var(--muted)}.pl-rank b{font-size:18px;color:inherit}
.pl-cr ul{margin:0;padding-left:16px;font-size:13px;color:var(--muted)}
.pl-edge{border-left:2px solid var(--ink, #16211f)}
.warn{margin:12px 0;padding:12px 14px;border:1.5px solid #c23030;border-radius:10px;background:var(--surface)}
.warn p{margin:6px 0 10px}
details summary{cursor:pointer;font-weight:600;padding:8px 0}
details ol{padding-left:20px;line-height:1.6}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.pal{display:grid;gap:8px;justify-items:start;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font:600 14px var(--font-body);color:var(--ink);text-align:left}
.pal[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pal-sw{display:flex;border-radius:6px;overflow:hidden;width:100%;height:22px}.pal-sw i{flex:1}
.colorpick{width:100%;height:44px;padding:2px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.overall{margin:6px 0 0;font-size:14px}.overall b{margin-left:6px}
.dict-wrap{display:grid;gap:6px;margin-top:10px}
.lesson-fb{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:6px}
.fb-label{font:600 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.pl-fb textarea{width:100%;min-width:180px;background:color-mix(in srgb,var(--y) 10%,var(--surface))}
.notesblk{margin-top:10px}
.notesblk h3{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ovr{margin-top:10px;display:grid;gap:6px}
.ovr h3{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:baseline}
.ovr textarea{line-height:1.45}
.scopelist{border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:2px 12px}
.scopelist .titem{padding:4px 0}
.field.wide{grid-column:1/-1}

.lo-card{box-shadow:var(--shadow);margin-top:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.lo-card h2{font-size:clamp(20px,4.6vw,27px);font-weight:600;line-height:1.2;margin-top:4px}
.criteria{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.criteria li{position:relative;padding-left:18px;color:var(--muted)}
.criteria li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;background:var(--accent);opacity:.7}
.lo-nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

.progress{margin-top:18px}
.pbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line-soft)}
.seg.R{background:var(--r)} .seg.Y{background:var(--y)} .seg.G{background:var(--g)} .seg.B{background:var(--b)}
.count{margin-top:6px;font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.pupils{list-style:none;margin:12px 0 0;padding:0;border-top:1.5px solid var(--line)}
.pupil{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,350px);gap:8px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft);transition:background-color .6s}
.pupil.flash{background:var(--line-soft)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.pn{font-weight:600;overflow-wrap:anywhere}
.note-toggle{background:none;border:1.5px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);min-height:28px}
.note-toggle.has{border-color:var(--accent);color:var(--accent)}
.note-box{grid-column:1/-1}
.dictate-row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.mic{gap:6px;display:inline-flex;align-items:center}
.mic.live{background:#c0322d;border-color:#c0322d;color:#fff}
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rate{
  min-height:46px;padding:4px 2px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);
  font-size:13px;font-weight:600;box-shadow:inset 0 -5px 0 var(--c);
}
.rate[data-r="R"]{--c:var(--r);--on:var(--on-r)}
.rate[data-r="Y"]{--c:var(--y);--on:var(--on-y)}
.rate[data-r="G"]{--c:var(--g);--on:var(--on-g)}
.rate[data-r="B"]{--c:var(--b);--on:var(--on-b)}
.rate[aria-pressed="true"]{background:var(--c);color:var(--on);border-color:var(--c);box-shadow:none}
.rate[aria-pressed="true"]::before{content:"\2713\00a0"}
.bulk{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){
  .pupil{grid-template-columns:1fr}
  .who{justify-content:space-between}
}

.scroll{box-shadow:var(--shadow);overflow-x:auto;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line-soft);white-space:nowrap}
thead th{font:500 12px var(--font-mono);color:var(--muted);background:var(--surface)}
th.sticky{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;font-weight:600;min-width:150px;border-right:1px solid var(--line-soft)}
tfoot td,tfoot th{font:500 12px var(--font-mono);color:var(--muted);border-bottom:0}
.sum{font:500 12px var(--font-mono);color:var(--muted)}
.cell{position:relative;width:36px;height:36px;border-radius:6px;border:0;background:var(--c);color:var(--on);font:600 13px var(--font-mono);display:inline-grid;place-items:center;padding:0}
.cell[data-r="R"]{--c:var(--r);--on:var(--on-r)}
.cell[data-r="Y"]{--c:var(--y);--on:var(--on-y)}
.cell[data-r="G"]{--c:var(--g);--on:var(--on-g)}
.cell[data-r="B"]{--c:var(--b);--on:var(--on-b)}

  u.tStrN = [1, 2, 3].indexOf(Number(u.tStrN)) >= 0 ? Number(u.tStrN) : 3;

function setRate(p, l, r){
  var k = mk(p, l), m = S.marks[k] || {r:'', n:'', d:'', h:[]};
  if (!m.h) m.h = [];
  var prev = m.r, pd = m.d, t = today();
  if (prev === r) { m.r = ''; }
  else {
    /* An earlier-dated rating is kept as history. A change on the same day simply replaces the mark. */
    if (prev && pd && pd < t) m.h.push({r:prev, d:pd});
    m.r = r;
  }
  m.d = (m.r || m.n) ? t : '';

var LEVEL = {R:1, Y:2, G:3, B:4}, WORD = {R:'Below', Y:'Towards', G:'Meeting', B:'Above'};
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function shortDate(d){ var x = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/); return x ? (+x[3]) + ' ' + MON[+x[2] - 1] : String(d || ''); }
function history(m){ var ev = (m && m.h ? m.h : []).slice(); if (m && m.r) ev.push({r:m.r, d:m.d || ''}); return ev; }
function cellNote(m){
  if (!m) return '';
  var parts = [];
  if (m.n) parts.push(m.n);
  if (m.h && m.h.length) parts.push('History: ' + history(m).map(function(e){ return (WORD[e.r] || e.r) + (e.d ? ' (' + shortDate(e.d) + ')' : ''); }).join(' > '));

}
function addCellNote(ws, r, c, m){ var t = cellNote(m); if (t) { var a = XLSX.utils.encode_cell({r:r, c:c}); if (ws[a]) { ws[a].c = [{a:'Markbook', t:t}]; ws[a].c.hidden = true; } } }
function changed(m){ return !!(m && m.r && m.h && m.h.length); }
/* Progress: the current rating is higher than the first one recorded */
function improved(m){ if (!changed(m)) return false; var f = history(m)[0]; return LEVEL[m.r] > LEVEL[f.r]; }
function progressOf(m){
  if (!m || !m.r) return {text:'', first:null, n:0};

  if (ev.length < 2) return {text:'First mark', first:first, n:1};
  var t = diff > 0 ? 'Up ' + diff + (diff === 1 ? ' level' : ' levels') : diff < 0 ? 'Down ' + (-diff) + (diff === -1 ? ' level' : ' levels') : 'Back to start';

}

/* ---------- parsing ---------- */
function parseDelimited(text){
  text = String(text).replace(/^﻿/, '');
  var first = text.split(/\r?\n/, 1)[0] || '';
  var cnt = function(ch){ return first.split(ch).length - 1; };
  var delim = (cnt('\t') > 0 && cnt('\t') >= Math.max(cnt(';'), cnt(','))) ? '\t' : (cnt(';') > cnt(',') ? ';' : ',');
  var rows = [], row = [], cell = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows;
}

function parsePupils(rows, defForm, defYear){
  var clean = rows.map(function(r){ return r.map(function(c){ return String(c == null ? '' : c).trim(); }); })
                  .filter(function(r){ return r.some(Boolean) && !/^e\.g\./i.test(r[0]); });
  if (!clean.length) return {groups:[], count:0};
  var head = clean[0].map(function(c){ return c.toLowerCase(); });
  var find = function(re){ for (var i = 0; i < head.length; i++) if (re.test(head[i])) return i; return -1; };
  var iName = find(/^(pupil|student|name|full name|pupil name)$/);
  var iFirst = find(/^(first name|firstname|forename|given name)$/);
  var iLast = find(/^(surname|last name|lastname|family name)$/);
  var iForm = find(/^(form|class|reg group|registration group|tutor group|form group)$/);
  var iYear = find(/^(year|year group|yr|grade)$/);
  var hasHead = iName >= 0 || iFirst >= 0 || iLast >= 0;
  var body = clean;
  if (hasHead) body = clean.slice(1);
  else { iName = 0; iForm = clean[0].length > 1 ? 1 : -1; iYear = clean[0].length > 2 ? 2 : -1; }
  var map = {}, order = [], count = 0;
  body.forEach(function(r){
    var name = iName >= 0 ? r[iName] : [iFirst >= 0 ? r[iFirst] : '', iLast >= 0 ? r[iLast] : ''].filter(Boolean).join(' ');
    name = String(name || '').replace(/\s+/g, ' ').trim(); if (!name) return;
    var form = (iForm >= 0 && r[iForm]) || defForm || 'Unassigned';
    var ym = iYear >= 0 ? String(r[iYear]).match(/\d+/) : null;
    var yr = ym ? ym[0] : '';
    if (!yr) { var fm = String(form).match(/^\d+/); yr = fm ? fm[0] : (defYear || ''); }
    var gid = slug(form) || 'form';
    if (!map[gid]) { map[gid] = {id:gid, name:form, year:yr, pupils:[]}; order.push(gid); }
    var g = map[gid]; if (!g.year && yr) g.year = yr;
    var id = gid + ':' + slug(name);
    if (!g.pupils.some(function(p){ return p.id === id; })) { g.pupils.push({id:id, name:name}); count++; }
  });
  return {groups:order.map(function(k){ return map[k]; }), count:count};
}

/* Success criteria can be separated by a semicolon, a new line, or a comma followed by a capital letter.
   A comma followed by a lower-case word stays inside the criterion, for example "Plan the inputs, outputs and conditions". */
function splitCriteria(v){
  return String(v == null ? '' : v).split(/\s*;\s*|\r?\n|,\s+(?=[A-Z])/).map(function(x){ return x.replace(/^[-•*]\s*/, '').trim(); }).filter(Boolean);
}
function parseCurriculum(text){
  var units = [], u = null, lo = null;
  var newUnit = function(t){ u = {id:unitIdFor(t, ''), title:t, year:'', _years:[], summary:'', los:[]}; units.push(u); lo = null; };
  String(text).split(/\r?\n/).forEach(function(raw){
    var line = raw.trim(); if (!line) return;
    var m;
    if ((m = line.match(/^(?:unit\s*:|#{1,3}\s)\s*(.+)$/i))) { newUnit(m[1].trim()); return; }
    if ((m = line.match(/^(?:year(?:\s*group)?|yr)\s*:\s*(.+)$/i))) { if (!u) newUnit('Untitled unit'); u._years = splitYears(m[1]); return; }
    if ((m = line.match(/^(?:summary|notes?)\s*:\s*(.*)$/i))) { if (!u) newUnit('Untitled unit'); u.summary = (u.summary ? u.summary + ' ' : '') + m[1].trim(); return; }
    if ((m = line.match(/^[-•*–]\s+(.+)$/))) { if (lo) lo.criteria.push(m[1].trim()); return; }
    if (!u) newUnit('Untitled unit');
    var cells = line.split('\t').map(function(c){ return c.trim(); }).filter(Boolean);
    var t = cells.shift().replace(/^(?:lo\s*\d*\s*[:.)-]\s*|\d+\s*[.)]\s+)/i, '').trim();
    if (!t) return;
    var crit = []; cells.forEach(function(c){ splitCriteria(c).forEach(function(x){ crit.push(x); }); });
    var id = loIdFor(u.title, t, '');
    if (u.los.some(function(l){ return l.id === id; })) return;
    lo = {id:id, text:t, criteria:crit};
    u.los.push(lo);
  });
  return units.filter(function(x){ return x.los.length; }).reduce(function(a, x){ return a.concat(expandYears(x)); }, []);
}

/* ---------- export scope: whole school, a year group, or one form ---------- */

    var y = v.slice(2), m = S.classes.filter(function(c){ return normYear(c.year) === y; });

}
function exYears(){

/* ---------- summaries: how each form or year group did on every objective and unit ---------- */

  if (t.classList.contains('rate')) {
    var li = t.closest('.pupil'), c = cur();
    setRate(li.dataset.p, c.lo.id, t.dataset.r); paintRow(li); paintProgress(); paintChip(); return;
  }
  var a = t.dataset.act; if (a && actions[a]) actions[a](t, e);
});
app.addEventListener('input', function(e){
  var ta = e.target;
  if (ta.tagName === 'TEXTAREA' && ta.classList.contains('lesson-ta')) {
    var id = ta.dataset.lo; if (ta.value.trim()) S.lessonNotes[id] = ta.value; else delete S.lessonNotes[id];
    Array.prototype.forEach.call(document.querySelectorAll('.lesson-ta[data-lo="' + id.replace(/"/g, '') + '"]'), function(o){ if (o !== ta) o.value = ta.value; });
    S.dirty++; save(); paintChip(); return;
  }
  if (ta.tagName === 'TEXTAREA' && ta.classList.contains('ovr-ta')) {
    var pp = null; S.classes.forEach(function(c){ c.pupils.forEach(function(x){ if (x.id === ta.dataset.p) pp = x; }); });
    if (pp) {
      var k = ovrKey(S.ui.tScope, pp);
      if (ta.value === overviewFor(pp, S.ui.tScope)) delete S.ovr[k]; else S.ovr[k] = ta.value;
      S.dirty++; save(); paintChip();
      var cnt = ta.closest('.ovr').querySelector('.ovr-count'); if (cnt) cnt.textContent = ta.value.length + ' characters';
    }
    return;
  }
  if (ta.tagName === 'TEXTAREA' && ta.closest('.pupil')) {
    var li = ta.closest('.pupil'), c = cur(); setNote(li.dataset.p, c.lo.id, ta.value);
    var tg = li.querySelector('.note-toggle'); if (tg) tg.classList.toggle('has', !!ta.value);
  }
});
app.addEventListener('change', function(e){
  var el = e.target, id = el.id;
  if (el.tagName === 'TEXTAREA' && (el.closest('.pupil') || el.classList.contains('lesson-ta'))) { S.dirty++; save(); paintChip(); return; }
  if (el.classList && el.classList.contains('scopeChk')) {
    var ns = 'all';
    if (el.dataset.scope !== 'all') {
      var picked = Array.prototype.map.call(app.querySelectorAll('.scopeChk:checked'), function(x){ return x.dataset.scope; }).filter(function(x){ return x !== 'all'; });
      var ordered = S.units.map(function(x){ return x.id; }).filter(function(x){ return picked.indexOf(x) >= 0; });
      if (ordered.length) ns = ordered.join('+');
    }
    S.ui.tScope = ns; save(); render(el.dataset.scope === 'all' || ns === 'all' ? 'sc-all' : el.id); return;
  }
  if (el.type === 'checkbox' && el.dataset.show) { S.ui[el.dataset.show] = el.checked; save(); render(); return; }
  if (el.type === 'checkbox' && el.dataset.k) {
    if (el.checked) delete S.excl[el.dataset.k]; else S.excl[el.dataset.k] = 1;
    S.dirty++; save(); paintChip(); return;
  }
  if (el.classList && el.classList.contains('pname-in')) {
    var ec = editingClass(), ep = ec && ec.pupils.filter(function(x){ return x.id === el.dataset.p; })[0], ev = el.value.replace(/\s+/g, ' ').trim();
    if (ep) { if (ev) { ep.name = ev; S.dirty++; save(); paintChip(); } else el.value = ep.name; }
    return;
  }
  if (id === 'edClassName' || id === 'edClassYear') {
    var cc = editingClass(), cv = el.value.trim();
    if (cc) {
      if (id === 'edClassName') { if (cv) cc.name = cv; else el.value = cc.name; } else cc.year = cv;
      S.dirty++; save(); render();
    }
    return;
  }
  if (id === 'selClass') { S.ui.classId = el.value; S.ui.addLo = false; save(); render(id); }
  else if (id === 'selUnit') { S.ui.unitId = el.value; S.ui.loId = ''; S.ui.addLo = false; save(); render(id); }
  else if (id === 'selLO') {
    if (el.value === '__new') { S.ui.addLo = true; save(); render('newLoText'); return; }
    S.ui.loId = el.value; S.ui.addLo = false; save(); render(id);
  }
  else if (id === 'gClass') { S.ui.gridClass = el.value; save(); render(id); }
  else if (id === 'gUnit') { S.ui.gridUnit = el.value; save(); render(id); }
  else if (id === 'tClass') { S.ui.tClass = el.value; save(); render(id); }
  else if (id === 'tStrN') { S.ui.tStrN = Number(el.value); save(); render(id); }
  else if (id === 'gClient') { lsSet(GKEY, el.value.trim()); gTok = null; }
  else if (id === 'numFrom' || id === 'numTo') { S.ui[id] = parseInt(el.value, 10) || (id === 'numFrom' ? 7 : 11); save(); render(id); }
  else if (/^rc-[RYGB]$/.test(id)) { S.ui.ratingColors[id.slice(3)] = el.value; S.ui.ratingPal = 'custom'; save(); render(); }
  else if (/^gm-[RYGB]$/.test(id)) { S.ui.gradeMap[id.slice(3)] = Math.min(9, Math.max(1, parseInt(el.value, 10) || 1)); save(); render(id); }
  else if (id === 'planYear') { S.ui.planYear = el.value; save(); render(id); }
  else if (id === 'exScope') { S.ui.exScope = el.value; save(); render(id); }
  else if (id === 'tOvrN') { S.ui.tOvrN = Number(el.value); save(); render(id); }
  else if (id === 'tTarN') { S.ui.tTarN = Number(el.value); save(); render(id); }
  else if (id === 'fileInput' && el.files[0]) { handleNamesFile(el.files[0]); }
  else if (id === 'restoreInput' && el.files[0]) { restoreFile(el.files[0]); }
  else if (id === 'tplInput' && el.files[0]) { handleTemplateFile(el.files[0]); }
});
app.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.id === 'newPupil') { e.preventDefault(); addPupil(); }
});
$('#homeBtn').addEventListener('click', function(){ go('home'); });
$('#nav').addEventListener('click', function(e){ var t = e.target.closest('button[data-tab]'); if (t && t.dataset.act === 'tab') go(t.dataset.tab); });
$('#chip').addEventListener('click', function(){ go('export'); });

render();
})();
</script>
